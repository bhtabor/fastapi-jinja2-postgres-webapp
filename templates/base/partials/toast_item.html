{# Toast content only — no wrapping container, no id. Included by
   base.html for the initial page-load flash and appended via
   turbo-stream into #toast-container for same-page toasts. #}
<div class="toast align-items-center text-bg-{{ level|default('danger') }} border-0 show"
     role="alert" aria-atomic="true" data-auto-dismiss="5s">
  <div class="d-flex">
    <div class="toast-body">{{ message }}</div>
    <button type="button" class="btn-close btn-close-white me-2 m-auto"
            data-bs-dismiss="toast" aria-label="Close"></button>
  </div>
</div>
